<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; width: 340px; margin: 0;
         font-size: 13px; color: #1a1a1a; }
  section { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; }
  h1 { font-size: 13px; margin: 0 0 6px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #666; margin: 0 0 6px; }
  button { cursor: pointer; border: 1px solid #bbb; border-radius: 6px; background: #fff;
           padding: 6px 10px; font-size: 12.5px; }
  button.primary { background: #1a56db; border-color: #1a56db; color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  select, input[type=file] { width: 100%; font-size: 12.5px; margin-top: 2px; }
  #status { color: #444; }
  #result { max-height: 220px; overflow-y: auto; }
  .ok { color: #15803d; }
  .warn { color: #b45309; }
  .err { color: #b91c1c; }
  ul { margin: 4px 0 0; padding-left: 16px; }
  li { margin-bottom: 2px; }
  .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid #ddd; border-radius: 12px; padding: 2px 8px; font-size: 11.5px;
          cursor: pointer; background: #f8f8f8; max-width: 100%; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { background: #eef2ff; }
  .muted { color: #777; font-size: 11.5px; }
</style>
</head>
<body>
  <section>
    <h1>Jobsearch Autofill</h1>
    <div id="status" class="muted">No data loaded.</div>
    <input type="file" id="import" accept=".json,application/json" title="Import autofill.json">
    <div class="muted">Generate the file with: <code>jobsearch.py export</code></div>
  </section>

  <section>
    <h2>Application</h2>
    <select id="job"></select>
    <div class="row">
      <button id="fill" class="primary" disabled>Fill this form</button>
      <button id="copy-cover" disabled>Copy cover letter</button>
      <button id="copy-resume" disabled>Copy resume (text)</button>
    </div>
    <div class="muted" style="margin-top:6px">Fills and highlights only — submitting is always your click. Resume PDF must be attached manually.</div>
  </section>

  <section>
    <h2>Quick copy</h2>
    <div class="row" id="chips"></div>
  </section>

  <section>
    <h2>Result</h2>
    <div id="result" class="muted">Run a fill to see what happened.</div>
  </section>

<script src="popup.js"></script>
</body>
</html>
